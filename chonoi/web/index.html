<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — Chợ Nổi Rạch Sen</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.45 system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel-wrap { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 13, 18, 0.72); backdrop-filter: blur(4px); z-index: 10; }
  .panel-wrap.open { display: flex; }
  .panel { background: #19242e; border: 2px solid #4fc3f7; border-radius: 14px; padding: 26px 32px; min-width: 460px; max-width: 680px; box-shadow: 0 18px 48px rgba(0,0,0,.55); font-size: 18px; }
  .panel h1, .panel h2 { margin: 0 0 12px; font-size: 26px; color: #ffe082; }
  .panel p { margin: 8px 0; color: #cfd8dc; }
  .list { margin: 12px 0; padding: 12px 16px; background: rgba(0,0,0,.28); border-radius: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 10px 0; padding: 10px 12px; background: rgba(255,255,255,.05); border-radius: 8px; }
  .btns { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  button { font: 600 18px/1.2 system-ui, sans-serif; padding: 10px 20px; border: 0; border-radius: 8px; cursor: pointer; background: #4fc3f7; color: #0c1821; }
  button.sec { background: #455a64; color: #eceff1; }
  button.warn { background: #ffb74d; color: #1b1205; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .muted { font-size: 16px; color: #90a4ae; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay" class="panel-wrap">
  <div id="panel" class="panel"></div>
</div>
<script src="/sprites.js"></script>
<script src="/art.js"></script>
<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const ovWrap = document.getElementById("overlay");
const ovPanel = document.getElementById("panel");

let snap = null, offline = false;
let uiScreen = null;  // "menu" | "quit" | "day_intro" | "evening_intro" | "day_result" | "shop" | "pause" | "summary" | null
let lastPhaseKey = "";
let introTimer = null;
let initializedMode = false;
let toastMsg = "", toastUntil = 0;
let lastRenderedUiKey = "";

const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo", bong_dien_dien: "Bông điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo" };
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây",
};
const UPGRADE_NAME = { oxygen: "Bình oxy", hp: "Áo phao (Máu)" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const dn = (d) => DISH_NAME[d] || d;
function spoiledBelow() {
  return (snap && snap.freshness_meta && snap.freshness_meta.spoiled_below !== undefined)
    ? snap.freshness_meta.spoiled_below : 30;
}
function isSpoiled(x) {
  return typeof x === "object" && x !== null && typeof x.fresh === "number" && x.fresh < spoiledBelow();
}
function itemKind(x) {
  return typeof x === "string" ? x : ((x && x.kind) || "");
}
function itemFresh(x) {
  return (typeof x === "object" && x !== null && typeof x.fresh === "number") ? x.fresh : 100;
}
function summarizeItems(list) {
  const usable = {}, minF = {}, maxF = {}, spoiled = {};
  (list || []).forEach((x) => {
    const k = itemKind(x);
    if (!k) return;
    if (isSpoiled(x)) {
      spoiled[k] = (spoiled[k] || 0) + 1;
    } else {
      usable[k] = (usable[k] || 0) + 1;
      const f = itemFresh(x);
      minF[k] = minF[k] === undefined ? f : Math.min(minF[k], f);
      maxF[k] = maxF[k] === undefined ? f : Math.max(maxF[k], f);
    }
  });
  return { usable, minF, maxF, spoiled };
}
function formatFreshList(list) {
  if (!list || !list.length) return "(trống)";
  const { usable, minF, maxF, spoiled } = summarizeItems(list);
  const kinds = Array.from(new Set([...Object.keys(usable), ...Object.keys(spoiled)]));
  return kinds.map((k) => {
    const parts = [];
    if (usable[k]) {
      const lo = Math.floor(minF[k]), hi = Math.floor(maxF[k]);
      parts.push(lo < hi ? `×${usable[k]} (${lo}–${hi}%)` : `×${usable[k]} (${lo}%)`);
    }
    if (spoiled[k]) parts.push(`${spoiled[k]} ươn`);
    return `${KIND_NAME[k] || k} ${parts.join(" + ")}`;
  }).join(", ");
}

// ---------- vào: phím & API ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function activePhase() {
  return snap ? (snap.phase || snap.mode || "gather") : "gather";
}

function currentInput() {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (activePhase() === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}

function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}

async function postJson(url, body) {
  try {
    await fetch(url, { method: "POST", body: JSON.stringify(body || {}), headers: { "Content-Type": "application/json" } });
  } catch (e) {}
}

async function sendPulseButton(btn, extra = {}) {
  await postJson("/input", Object.assign({ [btn]: true }, extra));
  await postJson("/input", { [btn]: false });
}

async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}

function setUiHold(hold) {
  postJson("/hold", { hold: !!hold });
}

function showIntro(screen, autoMs) {
  clearTimeout(introTimer);
  uiScreen = screen;
  setUiHold(true);
  if (autoMs > 0) {
    introTimer = setTimeout(() => closeIntro(), autoMs);
  }
  renderOverlay();
}

function closeIntro() {
  clearTimeout(introTimer);
  if (uiScreen === "day_intro" || uiScreen === "evening_intro" || uiScreen === "day_result") {
    uiScreen = null;
    setUiHold(false);
    renderOverlay();
  }
}

async function startPlayFromMenu() {
  clearTimeout(introTimer);
  down.clear(); lastSent = "";
  const isDay = snap && snap.mode === "day";
  await postJson("/restart", {});
  lastPhaseKey = isDay ? "1:gather" : "";
  if (isDay) {
    showIntro("day_intro", 4000);
  } else {
    uiScreen = null;
    setUiHold(false);
    renderOverlay();
  }
}

async function toggleServerPause() {
  if (uiScreen === "day_intro" || uiScreen === "evening_intro" || uiScreen === "day_result") {
    closeIntro();
    return;
  }
  if (uiScreen === "menu" || uiScreen === "quit") return;
  await sendPulseButton("pause");
}

function keyName(e) { return e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }

  if (uiScreen === "day_intro" || uiScreen === "evening_intro" || uiScreen === "day_result") {
    e.preventDefault();
    closeIntro();
    return;
  }
  if (k === "escape" || k === "p") {
    e.preventDefault();
    toggleServerPause();
    return;
  }
  if (uiScreen === "menu" || uiScreen === "quit") {
    if (k === "enter" || k === " ") { e.preventDefault(); startPlayFromMenu(); }
    return;
  }
  if (activePhase() === "shop" && snap && snap.state === "playing") {
    if (k === "1") { postJson("/input", { buy: "oxygen" }); return; }
    if (k === "2") { postJson("/input", { buy: "hp" }); return; }
    if (k === "e" || k === "enter") { sendPulseButton("shop_done"); return; }
  }

  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") {
    postJson("/restart", {});
    lastSent = ""; down.clear(); lastPhaseKey = ""; uiScreen = null;
    renderOverlay();
  }
  pushInput();
});

addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot & chuyển màn hình ----------
function checkTransitions(s) {
  if (!initializedMode && s) {
    initializedMode = true;
    if (s.mode === "day" && !s.finished && (s.tick < 5 || s.ui_hold)) {
      uiScreen = "menu";
      setUiHold(true);
      lastPhaseKey = `${s.day}:${s.phase}`;
      renderOverlay();
      return;
    }
    lastPhaseKey = `${s.day || 1}:${s.phase || s.mode}`;
  }

  // Kiểm thông báo shop
  const evs = s.events || [];
  if (evs.length) {
    const last = evs[evs.length - 1];
    if (last.name === "bought" && performance.now() > toastUntil - 1800) {
      toastMsg = `Đã mua ${UPGRADE_NAME[last.data.upgrade] || last.data.upgrade} cấp ${last.data.level}!`;
      toastUntil = performance.now() + 2500;
    } else if (last.name === "buy_failed" && performance.now() > toastUntil - 1800) {
      toastMsg = `Không thể mua (${last.data.reason})`;
      toastUntil = performance.now() + 2500;
    }
  }

  if (s.state === "paused") {
    if (uiScreen !== "pause" && uiScreen !== "menu" && uiScreen !== "quit") {
      uiScreen = "pause";
      renderOverlay();
    }
    return;
  }
  if (uiScreen === "pause" && s.state !== "paused") {
    uiScreen = null;
    renderOverlay();
  }

  if (s.finished) {
    if (uiScreen !== "summary" && uiScreen !== "menu" && uiScreen !== "quit") {
      uiScreen = "summary";
      renderOverlay();
    }
    return;
  }

  if (s.mode === "day" && uiScreen !== "menu" && uiScreen !== "quit") {
    const pk = `${s.day}:${s.phase}`;
    if (pk !== lastPhaseKey) {
      lastPhaseKey = pk;
      if (s.phase === "gather" && !s.ui_hold) {
        showIntro("day_intro", 4000);
      } else if (s.phase === "quan") {
        showIntro("evening_intro", 3500);
      } else if (s.phase === "shop") {
        showIntro("day_result", 0);
      }
    } else if (s.phase === "shop" && !uiScreen) {
      renderOverlay();
    }
  }
}

function renderOverlay() {
  const key = JSON.stringify({
    uiScreen,
    mode: snap && snap.mode,
    phase: snap && snap.phase,
    day: snap && snap.day,
    money: snap && snap.money,
    time: snap && Math.ceil((snap.time_left_ticks || 0) / 60),
    ups: snap && snap.upgrades,
    finished: snap && snap.finished,
    toast: performance.now() < toastUntil ? toastMsg : "",
  });
  const showShopPanel = snap && snap.phase === "shop" && uiScreen === null && !snap.finished;
  if (!uiScreen && !showShopPanel) {
    ovWrap.classList.remove("open");
    lastRenderedUiKey = "";
    return;
  }
  if (key === lastRenderedUiKey) return;
  lastRenderedUiKey = key;
  ovWrap.classList.add("open");

  if (uiScreen === "menu") {
    ovPanel.innerHTML = `
      <h1>Quán Ăn Chợ Nổi</h1>
      <p>Sáng cùng Út Sen lặn bắt cá, hái bông trên sông Chín Khúc. Tối mở quán phục vụ thực khách trên nhà bè Má Tư.</p>
      <div class="list">
        <div>• <b>WASD / Mũi tên</b>: Bơi / Đi · <b>E</b>: Hái / Cập bến / Bếp & Bàn</div>
        <div>• <b>Space</b>: Bắt cá · <b>Esc / P</b>: Tạm dừng · <b>R</b>: Chơi lại</div>
      </div>
      <div class="btns">
        <button onclick="startPlayFromMenu()">Chơi</button>
        <button class="sec" onclick="uiScreen='quit';renderOverlay()">Thoát</button>
      </div>`;
  } else if (uiScreen === "quit") {
    ovPanel.innerHTML = `
      <h2>Đã thoát trò chơi</h2>
      <p>Bạn có thể đóng tab trình duyệt hoặc mở lại menu.</p>
      <div class="btns"><button onclick="uiScreen='menu';renderOverlay()">Về menu</button></div>`;
  } else if (uiScreen === "pause") {
    ovPanel.innerHTML = `
      <h2>Tạm dừng</h2>
      <p>Đồng hồ và mọi timer gameplay (kể cả Shop) đang tạm dừng.</p>
      <div class="btns">
        <button onclick="toggleServerPause()">Tiếp tục (Esc / P)</button>
        <button class="sec" onclick="uiScreen='menu';setUiHold(true);renderOverlay()">Về menu</button>
      </div>`;
  } else if (uiScreen === "day_intro" && snap) {
    const plan = snap.day_plan || {};
    const dishesHtml = Object.entries(plan.dishes || {}).map(([d, n]) => `<div>• ${dn(d)} ×<b>${n}</b></div>`).join("");
    const ingHtml = Object.entries(plan.ingredients || {}).map(([k, n]) => `${KIND_NAME[k] || k} ×<b>${n}</b>`).join(" · ");
    ovPanel.innerHTML = `
      <h2>Ngày ${snap.day || 1} — Kế hoạch của Má Tư</h2>
      <p>Sáng nay cần chuẩn bị nguyên liệu cho các món dự kiến:</p>
      <div class="list">${dishesHtml || "<div>(Chưa có món)</div>"}<hr style="border-color:rgba(255,255,255,.15)"><div class="muted">Cần lấy: ${ingHtml || "—"}</div></div>
      <div class="btns"><button onclick="closeIntro()">Bắt đầu ngay (phím bất kỳ · tự chuyển sau 4s)</button></div>`;
  } else if (uiScreen === "evening_intro" && snap) {
    const stockList = Array.isArray(snap.stock) ? snap.stock : [];
    const { usable } = summarizeItems(stockList);
    const stockHtml = stockList.length
      ? stockList.map((x) => {
          const sp = isSpoiled(x);
          const lbl = `${x.id} ${KIND_NAME[x.kind] || x.kind} ${Math.floor(itemFresh(x))}%${sp ? " <b>(ươn)</b>" : ""}`;
          return sp ? `<span style="color:#ff8a80">${lbl}</span>` : lbl;
        }).join(" · ")
      : "(Trống)";
    const planDishes = Object.keys((snap.day_plan || {}).dishes || {});
    const cookable = planDishes.filter((d) => {
      const rec = ((snap.menu_meta || {})[d] || {}).recipe || {};
      return Object.entries(rec).every(([k, q]) => (usable[k] || 0) >= q);
    }).map((d) => dn(d)).join(", ");
    ovPanel.innerHTML = `
      <h2>Buổi tối — Mở Quán (Ngày ${snap.day || 1})</h2>
      <div class="list">
        <div><b>Kho nhập tối:</b> ${stockHtml || "(Trống)"}</div>
        <div style="margin-top:8px"><b>Món nấu được:</b> ${cookable || "(Không đủ nguyên liệu món nào)"}</div>
      </div>
      <div class="btns"><button onclick="closeIntro()">Mở cửa đón khách (phím bất kỳ)</button></div>`;
  } else if (uiScreen === "day_result" && snap) {
    const st = snap.stats || {};
    const repDelta = ((snap.reputation ?? 3) - (st.day_rep_start ?? 3)).toFixed(1);
    const sign = Number(repDelta) > 0 ? "+" : "";
    ovPanel.innerHTML = `
      <h2>Tổng kết Ngày ${snap.day || 1}</h2>
      <div class="list">
        <div>• Khách đã phục vụ: <b>${st.day_served ?? 0}</b> · Khách bỏ đi: <b>${st.day_left ?? 0}</b></div>
        <div>• Doanh thu ca: <b>${st.day_earned ?? 0}k</b> (Boa: <b>${st.day_tips ?? 0}k</b>)</div>
        <div>• Số dư hiện có: <b>${snap.money ?? 0}k</b> · Thay đổi uy tín: <b>${sign}${repDelta}</b> (hiện ${(snap.reputation ?? 3).toFixed(1)})</div>
      </div>
      <div class="btns"><button onclick="closeIntro()">Vào Chợ / Shop nâng cấp</button></div>`;
  } else if (showShopPanel) {
    const ups = snap.upgrades || {};
    const shopCfg = (snap.shop_meta || {}).upgrades || {};
    const stockTxt = Array.isArray(snap.stock) ? formatFreshList(snap.stock) : "(Trống)";
    let cards = "";
    ["oxygen", "hp"].forEach((key, idx) => {
      const lvls = shopCfg[key] || [];
      const cur = ups[key] || 0;
      const nxt = lvls[cur];
      const desc = nxt
        ? `Cấp ${nxt.level}: ${nxt.oxygen_max_s ? nxt.oxygen_max_s + "s oxy" : nxt.hp_max + " Máu"} — Giá <b>${nxt.price}k</b>`
        : "Đã đạt cấp tối đa";
      const canBuy = nxt && (snap.money ?? 0) >= nxt.price;
      cards += `<div class="row">
        <div><b>[${idx + 1}] ${UPGRADE_NAME[key]}</b> (hiện Cấp ${cur})<div class="muted">${desc}</div></div>
        <button ${canBuy ? "" : "disabled"} onclick="postJson('/input',{buy:'${key}'})">${nxt ? "Mua " + nxt.price + "k" : "Tối đa"}</button>
      </div>`;
    });
    const toastHtml = performance.now() < toastUntil ? `<p style="color:#ffe082">${toastMsg}</p>` : "";
    ovPanel.innerHTML = `
      <h2>Chợ Nâng Cấp — Ngày ${snap.day || 1} (Còn ${fmtTime(snap.time_left_ticks)})</h2>
      <p>Tiền hiện có: <b>${snap.money ?? 0}k</b> · Kho dư hôm nay (sẽ bỏ sau Shop): <span class="muted">${stockTxt}</span></p>
      ${cards}
      ${toastHtml}
      <div class="muted">Nâng cấp mới có hiệu lực từ Ngày kế tiếp.</div>
      <div class="btns"><button class="warn" onclick="sendPulseButton('shop_done')">Xong / Qua ngày (E / Enter)</button></div>`;
  } else if (uiScreen === "summary" && snap) {
    const sold = Object.entries((snap.stats || {}).dishes_sold || {}).sort((a, b) => b[1] - a[1]);
    const topStr = sold.length ? sold.map(([d, n]) => `${dn(d)} (×${n})`).join(", ") : "(Chưa bán món nào)";
    ovPanel.innerHTML = `
      <h1>${snap.mode === "day" ? "Tổng kết hành trình" : "Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc"}</h1>
      <div class="list">
        <div>• Tổng tiền còn lại: <b>${snap.money ?? 0}k</b> · Tổng thu (earned): <b>${snap.earned ?? 0}k</b></div>
        <div>• Uy tín: <b>${(snap.reputation ?? 0).toFixed(1)}</b> · Tổng điểm: <b>${snap.score ?? 0}</b></div>
        <div>• Món bán chạy: <b>${topStr}</b></div>
        <div class="muted">Lý do kết thúc: ${snap.reason || ""}</div>
      </div>
      <div class="btns">
        <button onclick="startPlayFromMenu()">Chơi lại (R)</button>
        <button class="sec" onclick="uiScreen='menu';setUiHold(true);renderOverlay()">Về menu</button>
      </div>`;
  }
}

async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    checkTransitions(snap);
  } catch (e) { offline = true; }
  setTimeout(poll, 32);
}
poll();

// ---------- vẽ ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "600 " : "") + (o.size || 18) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 4, { size: 18, align: "center", bold: true });
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 55 ? s.slice(0, 52) + "…" : s; } catch (e) { return ""; }
}
// Nhật ký sự kiện dạng câu dễ đọc (thay cho tên event + JSON thô). Event lạ vẫn hiện dạng thô để không mất thông tin.
const kn = (k) => KIND_NAME[k] || k;
// B1 -> "Bếp 1", T3 -> "Bàn 3" (id kỹ thuật không hiện cho người chơi)

  return ({ B: "Bếp ", T: "Bàn " }[m[1]] || m[1]) + m[2]; };

    case "quan_end": return `🏁 Đóng quán — thu ${d.shift_earned}k trong ca, uy tín ${Number(d.reputation).toFixed(1)}`;

function eventLog(w, h) {

function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 84, bottom = 74;
  const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;

  // trời + nước

  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();

  if (window.drawSeabed) window.drawSeabed(ctx, sx, sy, X, D, s);  // rong/đá CC0 trang trí

    ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();

  });

    if (!(window.ART && window.ART.fish(ctx, f, sx(f.pos[0]), sy(f.pos[1]), s))) {  // hình vẽ tay (art.js), lỗi thì vẽ khối
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);

    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();

    }

    ctx.beginPath(); ctx.ellipse(mx, my, 1.3 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    text("Cá Sấu", mx, my - 1.1 * s, { size: 18, align: "center", color: "#ffcdd2", bold: true });
    if (p && (m.state === "chase" || Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]) <= 10)) {

    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      if (!(window.ART && window.ART.utSenSide(ctx, px, py, s, p.heading_deg, underwater))) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.95 * s, py + Math.sin(a) * 0.95 * s); ctx.stroke();

    text("⚠ Thủy quái!", w - 16, 36, { size: 22, align: "right", color: "#ce93d8", bold: true });
  }

  // HUD trên (>= 18px)
  const lowTime = (snap.time_left_ticks || 0) <= 1800;
  const dayTag = snap.day ? `Ngày ${snap.day} · ` : "";

  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {

    if (p.oxygen_ticks === 0) text("Hết hơi!", 462, 33, { size: 20, bold: true, color: "#ff5252" });
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";

  }
  if (p && p.pos) {
    const d = p.pos[1];
    const zone = d < 10 ? "Nông" : (d < 20 ? "Giữa" : "Sâu");
    text(`Độ sâu ${d.toFixed(1)}m (${zone})`, 14, 66, { size: 18, color: "#b0bec5" });
  }
  if (p && p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 240, 66, { size: 18, color: "#ffd54f" });

  }

    text("WASD bơi · E hái/cập bến · Space bắt · Esc dừng", w - 14, h - 14, { size: 18, align: "right", color: "#9fb3c0" });

function drawQuan(w, h) {

  const X = b.x[1], Z = b.z[1], top = 84, bottom = 46;

    if (st.dish && st.dish.dish_id) text(st.dish.dish_id, sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 18, align: "center", color: "#2a1a0a" });

    else if (st.state === "ready") text("Chín [E]", sx(st.pos[0]), sy(st.pos[1]) + 1.45 * s, { size: 18, align: "center", color: "#1b4d14", bold: true });
  });

        bar(cx - 0.9 * s, cy + 0.65 * s, 1.8 * s, 8, c.eat_ticks_left / eatMax, "#66bb6a");

      }

  });

  // người chơi

  if (p) {

    if (!(window.ART && window.ART.utSenTop(ctx, px, py, s))) { ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill(); }
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");

  text(`Kho khả dụng: ${formatFreshList(availUsable)}${spoiledSuffix} · Tay: ${handText}`, 14, 66, { size: 18, color: spoiledStock.length ? "#ffe0b2" : "#cfd8dc" });
  text("WASD đi · E tương tác · Esc dừng · R chơi lại", w - 14, h - 14, { size: 18, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const ph = activePhase();
    if (ph === "quan" || ph === "shop") drawQuan(w, h); else drawGather(w, h);
    eventLog(w, h);
    if (offline) text("Mất kết nối tới máy chủ", w / 2, 34, { align: "center", color: "#ff8a80", size: 20 });
    if (snap.error) text("Lỗi mô phỏng — xem terminal. R để chơi lại.", w / 2, 62, { align: "center", color: "#ff8a80", size: 18 });
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 22 });
  }
}
requestAnimationFrame(frame);
</script>
